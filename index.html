<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081322">
<meta name="description" content="Win Win Building Materials Business Manager">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/win-win-logo.png">
<link rel="stylesheet" href="css/style.css">
<title>Win Win | Building Materials</title>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="icons/win-win-logo.png" alt="Win Win logo">
      <div><strong>Win Win</strong><span>Together we grow</span></div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button>
      <button class="nav-item" data-view="sales">＋ <span>New Sale</span></button>
      <button class="nav-item" data-view="invoices">▤ <span>Invoices</span></button>
      <button class="nav-item" data-view="receipts">▧ <span>Receipts</span></button>
      <button class="nav-item" data-view="customers">♙ <span>Customers</span></button>
      <button class="nav-item" data-view="products">▦ <span>Products & Stock</span></button>
      <button class="nav-item" data-view="purchases">↙ <span>Purchases</span></button>
      <button class="nav-item" data-view="quotations">▤ <span>Quotations</span></button>
      <button class="nav-item" data-view="payments">₵ <span>Payments</span></button>
      <button class="nav-item" data-view="deliveries">▣ <span>Deliveries</span></button>
      <button class="nav-item" data-view="expenses">− <span>Expenses</span></button>
      <button class="nav-item" data-view="reports">▥ <span>Reports</span></button>
      <button class="nav-item" data-view="staff">♟ <span>Staff</span></button>
      <button class="nav-item" data-view="settings">⚙ <span>Settings</span></button>
    </nav>
    <div class="sidebar-foot">Offline-ready • Ghana Cedi (GH₵)</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSubtitle">Manage your building-material business</p>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="quickSale">＋ Sale</button>
        <div class="sync-pill"><i></i><span>Local</span></div>
      </div>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
